name: Deploy EKH OS to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare public deployment folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          for file in index.html 404.html _redirects project_progress_snapshot.json; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

          test -f dist/index.html

      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=englishkidshub --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
